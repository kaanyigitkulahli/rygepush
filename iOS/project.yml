# XcodeGen proje tanımı: Apple Developer hesabı sürümü (TestFlight + Firebase ile anlık bildirim).
# Paket kimliği ve takım kimliği GitHub sırlarından gelir (RYGE_BUNDLE_ID, APPLE_TEAM_ID).
# Ücretsiz hesap sürümü: project-ucretsiz.yml
name: RygePush
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
schemes:
  RygePush:
    build:
      targets:
        RygePush: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  RygePush:
    type: application
    platform: iOS
    sources:
      - path: RygePush
        excludes:
          - "Info.plist"
          - "GoogleService-Info.plist"
    resources:
      - path: RygePush/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RYGE_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: RygePush/RygePush.entitlements
    info:
      path: RygePush/Info.plist
      properties:
        CFBundleDisplayName: RygePush
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [rygepush.yenile]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: RygePush/RygePush.entitlements
      properties:
        aps-environment: production
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
