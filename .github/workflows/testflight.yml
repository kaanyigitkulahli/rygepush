# RygePush'u GitHub'ın Mac makinesinde derler, Apple hesabınla imzalar ve TestFlight'a yükler.
# Gereken GitHub sırları (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID              Apple Developer takım kimliği (10 karakter)
#   RYGE_BUNDLE_ID             Paket kimliği, örnek: com.adin.rygepush
#   ASC_KEY_ID                 App Store Connect API anahtar kimliği
#   ASC_ISSUER_ID              App Store Connect API yayıncı kimliği (Issuer ID)
#   ASC_KEY_P8                 İndirdiğin AuthKey_XXXX.p8 dosyasının tüm içeriği
#   GOOGLE_SERVICE_INFO_PLIST  Firebase'den indirdiğin GoogleService-Info.plist dosyasının tüm içeriği
name: TestFlight

on:
  push:
    branches: [main]
    paths: ["iOS/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

jobs:
  yukle:
    # iOS 26 SDK'lı Xcode gerekiyor. Bu etiket bulunamazsa "macos-latest" yaz.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RYGE_BUNDLE_ID: ${{ secrets.RYGE_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Sırları kontrol et
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          eksik=0
          for ad in APPLE_TEAM_ID RYGE_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 GOOGLE_SERVICE_INFO_PLIST; do
            if [ -z "${!ad}" ]; then echo "::error::$ad sırrı eksik. KURULUM.md 3. adıma bak."; eksik=1; fi
          done
          exit $eksik

      - name: En yeni Xcode'u seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Bu makinede Xcode 26 ya da üstü yok. runs-on satırını değiştir."
            exit 1
          fi
          echo "Seçilen Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Anahtar ve Firebase dosyasını yerleştir
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > iOS/RygePush/GoogleService-Info.plist
          plutil -lint iOS/RygePush/GoogleService-Info.plist
          PLIST_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" iOS/RygePush/GoogleService-Info.plist)
          if [ "$PLIST_ID" != "$RYGE_BUNDLE_ID" ]; then
            echo "::error::GoogleService-Info.plist içindeki paket kimliği ($PLIST_ID) RYGE_BUNDLE_ID ile aynı değil."
            exit 1
          fi

      - name: Projeyi oluştur
        run: |
          brew install xcodegen
          cd iOS
          xcodegen generate

      - name: Arşivle ve imzala
        run: |
          cd iOS
          set -o pipefail
          xcodebuild \
            -project RygePush.xcodeproj \
            -scheme RygePush \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RygePush.xcarchive" \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tee archive.log | grep -E "error:|BUILD|ARCHIVE (SUCCEEDED|FAILED)"

      - name: TestFlight'a yükle
        run: |
          cd iOS
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RygePush.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -n 30
          echo "Yüklendi: derleme numarası ${{ github.run_number }}. TestFlight'ta 5-15 dakika içinde görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" iOS/RygePush/GoogleService-Info.plist

      - name: Hata günlüğünü sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-gunlugu
          path: |
            iOS/archive.log
            iOS/export.log
          if-no-files-found: ignore
